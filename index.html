<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reactor Watch — Nuclear Practice Bank</title>
<style>
  :root{
    --bg:#0A0E14;
    --panel:#121822;
    --panel2:#161D29;
    --border:#232C39;
    --amber:#FFB300;
    --amber-dim:#8A6A1F;
    --green:#35D0A0;
    --red:#FF5A52;
    --text:#E7ECF2;
    --text-dim:#8B96A5;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:var(--sans);
    -webkit-tap-highlight-color: transparent;
    height:100%;
  }
  body{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{
    max-width:560px; margin:0 auto; padding:20px 16px 40px;
  }
  header{
    display:flex; align-items:center; gap:14px; margin-bottom:18px;
  }
  .gauge{ position:relative; width:64px; height:64px; flex:0 0 auto; }
  .gauge svg{ width:64px; height:64px; transform:rotate(-90deg); }
  .gauge circle{ fill:none; stroke-width:6; }
  .gauge .track{ stroke:var(--panel2); }
  .gauge .fill{ stroke:var(--amber); stroke-linecap:round; transition:stroke-dashoffset .4s ease; }
  .gauge .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:13px; color:var(--amber); font-weight:600;
  }
  .title h1{
    margin:0; font-size:20px; letter-spacing:0.02em; font-weight:700; color:var(--text);
  }
  .title p{
    margin:2px 0 0; font-size:12.5px; color:var(--text-dim); font-family:var(--mono);
  }
  .controls{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
  }
  .chip{
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
    padding:7px 13px; border-radius:20px; font-size:13px; font-family:var(--mono);
    cursor:pointer; user-select:none; transition:all .15s ease;
  }
  .chip.active{ background:rgba(255,179,0,0.12); border-color:var(--amber-dim); color:var(--amber); }
  .chip:active{ transform:scale(0.96); }
  .toolbar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; margin-bottom:16px; font-family:var(--mono); font-size:12.5px; color:var(--text-dim);
  }
  .toolbar .btnrow{ display:flex; gap:8px; }
  .toolbar b{ color:var(--text); font-weight:600; }
  .toolbar button{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    padding:5px 10px; border-radius:8px; font-family:var(--mono); font-size:12px; cursor:pointer;
  }
  .toolbar button:active{ opacity:0.7; }
  .overlay{
    position:fixed; inset:0; background:rgba(5,7,10,0.72); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .celebrate-card{
    background:var(--panel); border:1px solid var(--amber-dim); border-radius:18px;
    padding:34px 24px 24px; max-width:340px; width:100%; text-align:center; position:relative; overflow:hidden;
  }
  .celebrate-pct{ font-family:var(--mono); font-size:46px; font-weight:700; color:var(--amber); margin:4px 0 6px; }
  .celebrate-title{ font-size:19px; font-weight:700; margin:0 0 4px; }
  .celebrate-sub{ font-size:13.5px; color:var(--text-dim); margin:0 0 20px; }
  .celebrate-badge{
    display:inline-block; font-family:var(--mono); font-size:11px; color:var(--green);
    border:1px solid var(--green); border-radius:20px; padding:3px 10px; margin-bottom:12px; letter-spacing:0.03em;
  }
  .celebrate-close{
    width:100%; background:var(--amber); color:#1A1200; border:none; padding:12px; border-radius:11px;
    font-weight:700; font-size:14.5px; cursor:pointer; font-family:var(--sans);
  }
  .confetti{
    position:absolute; top:-14px; width:7px; height:13px; opacity:0.95; border-radius:2px;
    animation: fall linear forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(360px) rotate(360deg); opacity:0; }
  }
  .qcounter{ font-family:var(--mono); font-size:12.5px; color:var(--text-dim); margin-bottom:8px; }
  .qmod{ color:var(--amber); }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:20px 18px; margin-bottom:14px;
  }
  .qtext{ font-size:17px; line-height:1.45; margin:0 0 16px; font-weight:500; }
  .opt{
    display:flex; align-items:flex-start; gap:12px;
    width:100%; text-align:left; background:var(--panel2); border:1px solid var(--border);
    color:var(--text); padding:13px 14px; border-radius:11px; margin-bottom:9px;
    font-size:15px; line-height:1.4; cursor:pointer; font-family:var(--sans);
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:last-child{ margin-bottom:0; }
  .opt .letter{
    font-family:var(--mono); font-weight:700; color:var(--text-dim); flex:0 0 auto; width:18px;
  }
  .opt:active{ background:#1B2330; }
  .opt.correct{ border-color:var(--green); background:rgba(53,208,160,0.08); }
  .opt.correct .letter{ color:var(--green); }
  .opt.incorrect{ border-color:var(--red); background:rgba(255,90,82,0.08); }
  .opt.incorrect .letter{ color:var(--red); }
  .opt.disabled{ cursor:default; }
  .opt.dim{ opacity:0.45; }
  .feedback{
    margin-top:14px; padding:14px 16px; border-radius:11px; font-size:14.5px; line-height:1.5;
    border-left:3px solid var(--border); background:var(--panel2);
  }
  .feedback.correct{ border-left-color:var(--green); }
  .feedback.incorrect{ border-left-color:var(--red); }
  .feedback .verdict{ font-weight:700; margin-bottom:5px; display:block; }
  .feedback.correct .verdict{ color:var(--green); }
  .feedback.incorrect .verdict{ color:var(--red); }
  .feedback .explain{ color:var(--text-dim); }
  .nextbtn{
    width:100%; margin-top:14px; background:var(--amber); color:#1A1200; border:none;
    padding:14px; border-radius:11px; font-size:15px; font-weight:700; cursor:pointer;
    font-family:var(--sans);
  }
  .nextbtn:active{ opacity:0.85; }
  .empty{
    text-align:center; padding:40px 20px; color:var(--text-dim);
  }
  .empty h2{ color:var(--text); font-size:18px; margin-bottom:8px; }
  .footer-note{
    text-align:center; font-size:11.5px; color:var(--text-dim); font-family:var(--mono);
    margin-top:24px; opacity:0.7; line-height:1.6;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0A0E14; --text:#E7ECF2;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="gauge">
      <svg viewBox="0 0 64 64">
        <circle class="track" cx="32" cy="32" r="27"></circle>
        <circle class="fill" id="gaugeFill" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"></circle>
      </svg>
      <div class="pct" id="gaugePct">--</div>
    </div>
    <div class="title">
      <h1>Reactor Watch</h1>
    </div>
  </header>

  <div class="controls" id="filterChips"></div>
  <div class="controls" id="lengthChips"></div>

  <div class="toolbar">
    <span>SCORE <b id="scoreText">0 / 0</b> &middot; BEST <b id="bestText">--</b></span>
    <div class="btnrow">
      <button id="reviewBtn">Review missed</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="qcounter" id="qCounter"></div>

  <div id="quizArea"></div>
</div>

<script>
const BANK = [
// ---------------- WEEK 7 / MODULE 1 — REACTOR FUNDAMENTALS ----------------
{m:1,q:"What fraction of natural uranium is U-235?",o:["0.7%","3–4%","20%","99.3%"],a:0,e:"Natural uranium is 99.3% U-238 and only 0.7% U-235; enrichment raises that fraction for reactor fuel."},
{m:1,q:"Low-enriched uranium (LEU) is uranium enriched to:",o:["Less than 0.7% U-235","Less than 20% U-235","20% or greater U-235","Greater than 90% U-235"],a:1,e:"LEU sits below 20% U-235; at 20% or above it becomes HEU."},
{m:1,q:"HALEU (high-assay LEU) refers to enrichment that is:",o:["Below 0.7%","Just under the 20% LEU/HEU boundary","Exactly 3–5%","Above 90%"],a:1,e:"HALEU is technically still LEU but sits at the high end of that range, just under the 20% line."},
{m:1,q:"Depleted uranium is uranium with a U-235 content that is:",o:["Less than 0.7%","Between 3–5%","Between 5–20%","Greater than 20%"],a:0,e:"Depleted uranium has had U-235 stripped out by enrichment, leaving it below the natural 0.7% level."},
{m:1,q:"A fissile material is one that:",o:["Fissions readily on capturing a slow (thermal) neutron","Can never undergo fission","Only fissions when bombarded with alpha particles","Is used exclusively for shielding"],a:0,e:"Fissile nuclides — U-235 is the standard example — split readily on capturing a slow neutron."},
{m:1,q:"A fertile material is best defined as one that:",o:["Fissions directly with any neutron energy","Cannot absorb neutrons","Transmutes into a fissile nuclide after absorbing a neutron","Is only found in naval reactor fuel"],a:2,e:"U-238 is the standard example — it absorbs a neutron and transmutes into Pu-239, which is fissile."},
{m:1,q:"\u201cFissionable\u201d is a broader term than \u201cfissile\u201d because it also includes nuclides that:",o:["Never fission under any conditions","Require a fast, high-energy neutron to fission","Only exist as byproducts of decay","Are used solely as moderators"],a:1,e:"Fissionable covers any nuclide that can fission, including those (unlike U-235) that need a fast rather than thermal neutron."},
{m:1,q:"A \u201cthermal reactor\u201d is one that:",o:["Operates at unusually high temperature","Relies on neutrons slowed to thermal energies to sustain fission","Uses no moderator at all","Only exists in naval propulsion"],a:1,e:"Thermal reactors slow fission neutrons down via a moderator so U-235 fissions more readily — the term describes neutron energy, not operating temperature."},
{m:1,q:"Fission neutrons are born fast, with an average energy of about:",o:["0.2 MeV","2 MeV","20 MeV","200 MeV"],a:1,e:"Fission neutrons start at roughly 2 MeV and must be slowed by a moderator to thermal energies."},
{m:1,q:"Roughly how much energy is released per U-235 fission event?",o:["2 MeV","20 MeV","200 MeV","2,000 MeV"],a:2,e:"About 200 MeV is released per fission, distributed among fragments, neutrons, and gamma/beta emissions."},
{m:1,q:"A single U-235 fission event typically produces:",o:["One fragment and one neutron","Two fragments and 2–3 neutrons","Four fragments and no neutrons","Ten fragments and ten neutrons"],a:1,e:"Fission splits the nucleus into two unequal fragments plus 2–3 neutrons, releasing about 200 MeV."},
{m:1,q:"The delayed neutron fraction (\u03b2-effective) for U-235 is approximately:",o:["0.0065% (essentially negligible)","0.65%","6.5%","65%"],a:1,e:"\u03b2-eff \u2248 0.65% for U-235 — a small fraction, but pivotal to reactor control."},
{m:1,q:"Delayed neutrons matter to reactor control mainly because they:",o:["Carry most of the total fission energy","Stretch the average neutron generation time from under a millisecond to many seconds","Are the only neutrons capable of causing fission","Eliminate the need for control rods entirely"],a:1,e:"By lengthening generation time from under 0.1 ms to over 10 seconds, delayed neutrons slow the chain reaction enough for control rods and operators to manage it."},
{m:1,q:"A reactor at keff = 1 is described as:",o:["Subcritical","Critical","Supercritical","Prompt critical"],a:1,e:"keff = 1 means the neutron population is neither growing nor shrinking — the definition of critical."},
{m:1,q:"A reactor with keff greater than 1 is:",o:["Subcritical, with falling power","Critical, with steady power","Supercritical, with rising power","Always prompt critical"],a:2,e:"keff > 1 means each generation produces more neutrons than the last, so power rises — supercritical."},
{m:1,q:"Reactivity is best described as a measure of:",o:["The total power output of a reactor","How far a reactor's condition is from criticality","The physical size of the reactor core","The enrichment level of the fuel"],a:1,e:"Reactivity can be positive, zero, or negative, and the larger its magnitude, the further the reactor is from criticality."},
{m:1,q:"Inserting a control rod into the core adds:",o:["Positive reactivity, raising power","Negative reactivity, lowering power","No change to reactivity","Positive reactivity only above prompt critical"],a:1,e:"Control rods absorb neutrons; inserting them removes neutrons from the chain reaction, driving reactivity negative."},
{m:1,q:"A negative temperature coefficient of reactivity is a required safety feature because it:",o:["Removes the need for a moderator","Automatically adds negative reactivity as temperature rises, self-limiting power","Increases the fuel enrichment needed","Only matters during shutdown"],a:1,e:"As power and temperature rise, a negative coefficient pulls reactivity back down, capping the rise without operator action — an international design requirement for thermal reactors."},
{m:1,q:"Normal operating pressure and temperature for a PWR primary circuit are approximately:",o:["1 atm and 100\u00b0C","150 atm (15 MPa) and 300\u00b0C","1,000 atm and 1,000\u00b0C","15 atm and 30\u00b0C"],a:1,e:"The primary circuit runs at roughly 150 atm (15 MPa) and 300\u00b0C — pressurised precisely to keep that hot water liquid."},
{m:1,q:"A 2-loop PWR functional diagram typically shows:",o:["One coolant pump total, shared across both loops","Two coolant pumps per loop","No coolant pumps, relying on natural circulation only","Four separate reactor vessels"],a:1,e:"The standard 2-loop PWR arrangement includes two coolant pumps per loop, circulating primary water through the core and steam generators."},
{m:1,q:"Approximately what fraction of full power remains as decay heat immediately after shutdown?",o:["0.1%","1%","6.5%","25%"],a:2,e:"Decay heat is about 6.5% of full power right at shutdown, falling to roughly 1% at one hour and 0.1% at one year."},
{m:1,q:"One year after shutdown, decay heat has typically fallen to approximately:",o:["6.5% of full power","1% of full power","0.5% of full power","0.1% of full power"],a:3,e:"The decay heat curve runs 6.5% at shutdown, ~1% at one hour, ~0.5% at 24 hours, and ~0.1% at one year."},
{m:1,q:"Which of the following is NOT one of the three barriers to fission product release?",o:["Fuel cladding","Primary coolant piping","Containment building","The biological shield"],a:3,e:"The three barriers are cladding, primary piping, and containment; the biological shield is a separate radiation-attenuation structure."},
{m:1,q:"The build-up of fission product poisons in fuel over an operating cycle (\u201cslagging\u201d) does what to reactivity?",o:["Adds positive reactivity, boosting power","Adds negative reactivity, undermining fuel utilisation","Has no measurable effect","Only matters after the reactor is shut down"],a:1,e:"Poisons absorb neutrons parasitically, driving reactivity negative and reducing how efficiently the remaining U-235 is used."},
{m:1,q:"The rule-of-thumb rate of U-235 consumption in an operating reactor is approximately:",o:["1 gram per MW-day of thermal output","1 kilogram per MW-day of thermal output","1 gram per MW-year of thermal output","1 tonne per MW-day of thermal output"],a:0,e:"About 1 gram of U-235 is consumed per MW-day of thermal power — the standard multiplier for burnup estimates."},
{m:1,q:"Plutonium-239 is produced in a reactor by:",o:["Direct fission of U-235","Transmutation of U-238 after neutron capture","Decay of fission product fragments","Enrichment of natural uranium"],a:1,e:"U-238 absorbs a neutron and transmutes (via short-lived intermediates) into Pu-239 — the conversion process underlying fertile materials."},
{m:1,q:"A \u201cbreeder\u201d reactor is one specifically designed to:",o:["Minimise power output for safety","Produce more fissionable fuel than it consumes","Operate without any moderator","Run exclusively on depleted uranium"],a:1,e:"Breeder reactors are designed so the fissionable fuel produced (via conversion) exceeds the fuel burnt up."},
{m:1,q:"In terms of typical thermal power scale, an SMR (including propulsion reactors) sits in the range of:",o:["Tens of MWth, like a research reactor","Hundreds of MWth","Thousands of MWth, like a large power plant","Under 1 MWth"],a:1,e:"Research reactors (like OPAL) run in the tens of MWth, SMRs in the hundreds, and large land-based plants in the thousands."},
{m:1,q:"Compared with a civilian PWR, a naval propulsion reactor typically has:",o:["Lower enrichment and larger core size","Much higher enrichment and a smaller, more compact core","Identical enrichment and fuel form","No moderator at all"],a:1,e:"Naval reactors run around 300 MWth at very high enrichment (HEU) with plate-type dispersion fuel, versus a civilian PWR's ~3,000 MWth at 3–5% enrichment with ceramic UO2 pellets."},
{m:1,q:"Civilian PWR fuel is typically fabricated as:",o:["Plate-type dispersion fuel","Ceramic UO2 pellets stacked in fuel pins","Liquid uranium salt","Pure metallic uranium foil"],a:1,e:"Civilian power reactor fuel uses ceramic UO2 pellets loaded into pins, unlike the plate-type dispersion fuel used in naval cores."},
{m:1,q:"Australia's nuclear power ban under the EPBC Act blocks approval of all of the following EXCEPT:",o:["A nuclear power station","An enrichment plant","A research reactor for medical isotope production","A reprocessing facility"],a:2,e:"The ban targets power generation and fuel-cycle facilities; it doesn't prevent a research reactor, which is why OPAL operates legally."},
{m:1,q:"OPAL, Australia's only operating nuclear reactor, is best described as:",o:["A commercial power station","A research reactor used for isotope production, neutron scattering, and silicon doping","A naval propulsion prototype","A decommissioned test reactor"],a:1,e:"OPAL at Lucas Heights is a non-power research reactor, not a power station."},
{m:1,q:"Approximately how many countries currently use nuclear power to generate electricity?",o:["About 10","About 31","About 75","About 150"],a:1,e:"Roughly 31 countries operate nuclear power for electricity generation worldwide."},
{m:1,q:"Nuclear fission currently produces roughly what share of the world's electricity?",o:["Under 1%","About 10%","About 50%","About 90%"],a:1,e:"Nuclear power supplies close to 10% of global electricity generation."},

// ---------------- WEEK 8 / MODULE 2 — RADIATION SAFETY ----------------
{m:2,q:"An alpha particle is stopped by:",o:["A sheet of paper or a short air gap","A few millimetres of aluminium","Several centimetres of lead","Metres of concrete"],a:0,e:"Alpha is the least penetrating of the four radiation types — its hazard comes mainly from internal contamination, not external exposure."},
{m:2,q:"Beta radiation is best managed as an external hazard by:",o:["Metres of concrete shielding","Keeping it off the skin with protective clothing","Ignoring it entirely, since it poses no risk","Using only lead shielding"],a:1,e:"Beta is an external hazard to skin and eyes only, stopped by a centimetre of perspex or thin aluminium — protective clothing is the practical control."},
{m:2,q:"Gamma radiation passing through a material is attenuated:",o:["Not at all — gamma cannot be shielded","Linearly with thickness regardless of material","Exponentially, governed by the material's linear absorption coefficient","Only by hydrogen-rich materials"],a:2,e:"Gamma attenuation is exponential, with the linear absorption coefficient (\u03bc) depending on both material and gamma energy."},
{m:2,q:"Neutron radiation is best shielded using:",o:["Dense metals like lead alone","Hydrogen-rich (hydrogenous) materials","Nothing — neutrons cannot be attenuated","Thin aluminium foil"],a:1,e:"Neutrons are never fully stopped, only attenuated, and hydrogenous materials (water, polyethylene) are the effective shielding choice."},
{m:2,q:"Absorbed dose (D) is defined as:",o:["Energy imparted per unit mass of exposed material","The total number of decays per second","The biological damage caused by radiation","The distance travelled by a radiation particle"],a:0,e:"D = \u0394E/m, measured in gray (Gy); it says nothing yet about biological effect, which is what equivalent dose adds."},
{m:2,q:"1 gray (Gy) is equivalent to:",o:["1 rad","10 rad","100 rad","1,000 rad"],a:2,e:"1 Gy = 100 rad, the same factor of 100 that relates sievert to rem."},
{m:2,q:"Equivalent dose (H) is calculated as:",o:["Absorbed dose divided by time","Absorbed dose multiplied by the radiation weighting factor","Activity multiplied by distance","Absorbed dose minus background dose"],a:1,e:"H = D \u00d7 \u03c9, where \u03c9 reflects how biologically damaging a given radiation type is."},
{m:2,q:"The radiation weighting factor (\u03c9) is highest for which radiation type?",o:["Gamma","Beta","Thermal neutron","Alpha"],a:3,e:"Alpha carries \u03c9 = 20, far above gamma and beta (\u03c9 = 1) and thermal neutrons (\u03c9 = 2.5)."},
{m:2,q:"The radiation weighting factor for gamma and beta radiation is:",o:["0.1","1","2.5","20"],a:1,e:"Gamma and beta are both assigned \u03c9 = 1, the baseline against which alpha and neutron are compared."},
{m:2,q:"The radiation weighting factor used for thermal neutrons in this course is:",o:["1","2.5","10","20"],a:1,e:"Thermal neutrons carry \u03c9 = 2.5, between the baseline (gamma/beta) and alpha's much higher value."},
{m:2,q:"The SI unit of radioactivity (activity) is the:",o:["Sievert","Gray","Becquerel","Rem"],a:2,e:"The becquerel (Bq) is one decay per second; the curie (Ci) is the older, much larger unit."},
{m:2,q:"Dose rate is best described as:",o:["Total dose divided by source activity","Dose received per unit time","The weighting factor applied to absorbed dose","A measure only used for alpha radiation"],a:1,e:"Dose rate (\u03bcSv/h or mSv/h) is dose per unit time; total dose received equals dose rate multiplied by time spent in the field."},
{m:2,q:"Natural background radiation comes from three main sources:",o:["Medical, industrial, and consumer sources","Cosmic, terrestrial, and radiation from within the body","Nuclear power plants, hospitals, and airports","Fission products, actinides, and CRUD"],a:1,e:"Cosmic rays, terrestrial radionuclides, and internal sources (like potassium-40 in the body) make up natural background, with artificial sources added on top by modern life."},
{m:2,q:"NORM (Naturally Occurring Radioactive Materials) becomes a human exposure concern mainly because:",o:["It doesn't exist in nature at all","Human activities like coal burning and mineral processing concentrate or redistribute it","It only affects nuclear plant workers","It is entirely eliminated by modern regulation"],a:1,e:"Activities such as coal burning, fertiliser production, and oil, gas and mineral processing concentrate naturally occurring radioactivity into human exposure pathways."},
{m:2,q:"The average annual radiation dose to a resident of Australia from all sources is approximately:",o:["0.1 mSv","2–3 mSv","20 mSv","200 mSv"],a:1,e:"Australians receive roughly 2–3 mSv per year on average — this course-specific figure differs from higher US averages driven by medical imaging rates."},
{m:2,q:"A thermoluminescent dosimeter (TLD) is best described as:",o:["A real-time dose-rate alarm","The dose of record, read out after a monitoring period","A device that shields the wearer from radiation","A type of biological shield material"],a:1,e:"The TLD is the legal dose of record, read out after the fact rather than giving live feedback."},
{m:2,q:"A personal electronic dosimeter (PED) is used mainly because it:",o:["Replaces the need for any dose limit","Provides real-time dose and dose-rate information","Is more accurate than a TLD as a legal record","Only detects alpha radiation"],a:1,e:"The PED gives immediate, real-time feedback on dose and dose rate, complementing the TLD's after-the-fact record."},
{m:2,q:"Personal dosimetry is generally issued to a worker when they are expected to receive:",o:["Any measurable dose at all, however small","A significant fraction (roughly 10% or more) of the applicable dose limit","Only doses above the LD50/30 threshold","Doses exclusively from alpha sources"],a:1,e:"The practical threshold for issuing dosimetry is around 10% of the relevant dose limit."},
{m:2,q:"Deterministic effects of radiation exposure are characterised by:",o:["No threshold dose, with probability scaling with dose","A threshold dose, with severity increasing above that threshold","Only occurring decades after exposure","Being entirely unrelated to dose received"],a:1,e:"Deterministic effects (like acute radiation sickness) require exceeding a threshold dose, and severity worsens as dose rises further."},
{m:2,q:"Stochastic effects of radiation exposure are characterised by:",o:["A threshold below which no effect is assumed possible, with severity scaling with dose","No assumed threshold, with the probability (not severity) of occurrence scaling with dose","Always appearing within days of exposure","Only affecting bone marrow"],a:1,e:"Cancer and hereditary effects are stochastic: no safe threshold is assumed, and higher dose means higher probability, not worse severity, of the effect."},
{m:2,q:"Acute radiation sickness (nausea, vomiting) can be induced by an acute absorbed dose of roughly:",o:["0.001 Gy or more","1 Gy or more","100 Gy or more","10,000 Gy or more"],a:1,e:"An acute dose of about 1 Gy or more can trigger radiation sickness from cellular damage in the intestinal lining."},
{m:2,q:"LD50/30, as used in this course, is approximately:",o:["0.45 Sv","4.5 Sv","45 Sv","450 Sv"],a:1,e:"LD50/30 — the dose expected to kill 50% of an exposed population within 30 days without treatment — is 4.5 Sv in this course's figures."},
{m:2,q:"The dose-risk factor of approximately 0.05 per sievert applies specifically to:",o:["Deterministic effects only","Stochastic effects only","Both equally","Neither — it's a shielding constant"],a:1,e:"This factor estimates additional fatal cancer risk from low-dose, low-dose-rate exposure — a stochastic-effect calculation, not a deterministic one."},
{m:2,q:"When applying the dose-risk factor, the resulting cancer risk figure should be interpreted as:",o:["The total absolute lifetime cancer risk for that person","An additional risk on top of the baseline population cancer rate","A risk that only applies to children","A risk that disappears after ALARA is applied"],a:1,e:"The dose-risk factor estimates incremental (additional) risk above the baseline lifetime cancer rate already present in the population, not an absolute rate."},
{m:2,q:"\u201cDetriment\u201d in radiation protection refers to:",o:["The total dose received regardless of organ","A weighting of risk that accounts for which organ was exposed and its cancer latency","A synonym for absorbed dose","A measure used only for external dose"],a:1,e:"Detriment weights risk by organ radiosensitivity and typical latency period — bone marrow carries higher detriment than skin for the same dose — and underpins tissue weighting factors."},
{m:2,q:"The Linear No-Threshold (LNT) model is best described as:",o:["A settled scientific fact with no remaining debate","A conservative regulatory default that some experts dispute below about 100 mSv","A model proving low doses are always beneficial","A model that applies only to neutron radiation"],a:1,e:"LNT is a deliberately conservative assumption; the course material is explicit that harm below ~100 mSv is not conclusively established and some propose an adaptive or hormetic response instead."},
{m:2,q:"Radiation hormesis is the hypothesis that:",o:["All radiation exposure is equally harmful regardless of dose","Low doses of radiation may be beneficial by stimulating repair mechanisms","High doses are less dangerous than low doses","Radiation exposure has no biological effect at any dose"],a:1,e:"Hormesis proposes that low, near-background doses may activate protective repair mechanisms — a contested alternative to LNT."},
{m:2,q:"The three principles of radiological protection are justification, limitation, and:",o:["Detriment","Optimisation (ALARA)","Contamination control","Criticality"],a:1,e:"Justification (do more good than harm), optimisation (ALARA — keep doses as low as reasonably achievable), and limitation (hard dose caps) make up the three principles."},
{m:2,q:"The \u201cjustification\u201d principle of radiological protection states that:",o:["Any action changing radiation exposure should do more good than harm","Doses must always be reduced to exactly zero","Only regulators may justify radiation use","Justification only applies to medical exposure"],a:0,e:"Justification requires that a decision altering radiation exposure produce a net benefit before it proceeds."},
{m:2,q:"ALARA stands for a principle meaning doses should be:",o:["Always Limited At Regulatory Amounts","As Low As Reasonably Achievable","Averaged over the Legal Annual Reporting Allowance","Assessed Locally Against Radiation Averages"],a:1,e:"ALARA explicitly allows societal and economic factors into what counts as \u201creasonable\u201d — it doesn't demand zero dose at any cost."},
{m:2,q:"For an occupationally exposed worker, the standing annual effective dose limit is:",o:["1 mSv","20 mSv","50 mSv","100 mSv"],a:1,e:"20 mSv/year is the standing occupational limit, separate from the 50 mSv absolute single-year ceiling."},
{m:2,q:"The occupational dose limit includes a further provision that effective dose must not exceed, in any single year:",o:["1 mSv","20 mSv","50 mSv","500 mSv"],a:2,e:"While the standing limit is 20 mSv/year, a hard ceiling of 50 mSv in any one year also applies."},
{m:2,q:"The annual effective dose limit for members of the public is:",o:["1 mSv","20 mSv","50 mSv","100 mSv"],a:0,e:"The public dose limit is 1 mSv/year, with provision for a higher single-year value if the five-year average stays at or below 1 mSv/year."},
{m:2,q:"When a pregnancy is declared by an occupationally exposed worker, the additional dose limit to the embryo/foetus for the remainder of the pregnancy is approximately:",o:["0.1 mSv","1 mSv","20 mSv","50 mSv"],a:1,e:"Working conditions should ensure the additional dose to the embryo/foetus does not exceed about 1 mSv for the rest of the pregnancy."},
{m:2,q:"Separate dose limits exist for the eye and skin mainly because:",o:["The eye and skin cannot be shielded at all","Different organs have varying radiosensitivities, such as cataract risk in the eye and skin cancer risk from beta contamination","Eyes and skin are never actually exposed to radiation","Regulators arbitrarily chose different numbers"],a:1,e:"Radiosensitivity varies by organ — the eye's cataract risk and skin's beta-driven cancer risk justify their own separate limits."},
{m:2,q:"Internal dose from contamination is primarily controlled by:",o:["Increasing distance from external sources only","Minimising surface contamination and prohibiting eating, drinking or smoking in controlled areas","Wearing a TLD badge","Using only gamma shielding"],a:1,e:"Because internal dose comes from inhaling or ingesting contamination, the controls focus on preventing that pathway rather than external shielding or distance."},
{m:2,q:"Context given for the occupational dose limit: below what dose do health experts find no demonstrated deleterious effects or increased cancer incidence?",o:["1 mSv","20 mSv","100 mSv","1,000 mSv"],a:2,e:"Below about 100 mSv, no clinically demonstrated harmful effect or increased cancer incidence has been established, which frames how conservative the 20 mSv occupational limit actually is."},
{m:2,q:"The (SI) Ci-m-rem rule of thumb, based on Co-60, states approximately that:",o:["3 GBq produces about 1 mSv/h at 1 metre unshielded","3 GBq produces about 1 Sv/h at 1 metre unshielded","30 GBq produces about 1 \u03bcSv/h at 1 metre unshielded","3 Bq produces about 1 mSv/h at 1 metre unshielded"],a:0,e:"The SI form of the rule: roughly 3 GBq (or equivalently 3 MBq for 1 \u03bcSv/h) gives about 1 mSv/h unshielded at 1 metre, based on Co-60's gamma output."},
{m:2,q:"\u201cTenth thickness\u201d is defined as the thickness of a material that:",o:["Doubles the dose rate of a gamma source","Reduces the dose rate of a gamma source by 90%","Completely eliminates all gamma radiation","Only applies to neutron shielding"],a:1,e:"Tenth thickness cuts gamma dose rate to one-tenth (a 90% reduction); stacking multiple tenth-thicknesses gives further factor-of-ten reductions."},
{m:2,q:"For high-energy (~2 MeV) gammas, the approximate tenth thickness of concrete is:",o:["3 cm","30 cm","300 cm","3,000 cm"],a:1,e:"Concrete's tenth thickness for ~2 MeV gammas is roughly 30 cm, versus about 5 cm for lead and 60 cm for water."},
{m:2,q:"Of the standard tenth-thickness shielding materials for high-energy gammas, which requires the LEAST thickness?",o:["Lead","Steel","Concrete","Water"],a:0,e:"Lead's density makes it the most efficient of the four at about 5 cm, versus 10 cm steel, 30 cm concrete, and 60 cm water."},
{m:2,q:"According to the inverse square law, doubling your distance from a point radiation source reduces dose rate to:",o:["Half","A quarter","An eighth","No change"],a:1,e:"Dose rate falls with the square of distance, so doubling distance cuts dose rate to a quarter, not a half."},
{m:2,q:"According to the inverse square law, increasing distance from a source tenfold reduces dose rate by a factor of:",o:["10","50","100","1,000"],a:2,e:"Because the relationship is inverse-square, a tenfold increase in distance gives a hundredfold reduction in dose rate."},
{m:2,q:"At a nuclear reactor facility, external dose from gamma radiation is usually the main concern (rather than internal contamination) because:",o:["Gamma is the only radiation type reactors produce","Contamination is tightly controlled through containment and monitoring","Internal dose limits don't apply at reactors","Alpha and beta are never produced by fission"],a:1,e:"Fission product containment, habitable-space monitoring, and no-eating/drinking rules keep contamination pathways controlled, leaving penetrating gamma as the main residual hazard."},
{m:2,q:"The purpose of a reactor's biological shield is to:",o:["Contain fission products within the fuel","Attenuate neutron and gamma radiation from the core and primary system to protect personnel","Prevent the chain reaction from becoming supercritical","Cool the reactor during shutdown"],a:1,e:"The biological shield is a separate function from the fission-product barriers — it exists purely to bring radiation levels outside it down to safe levels for personnel."},
{m:2,q:"A typical power reactor's biological shield achieves a dose reduction on the order of:",o:["10 times","100 times","10,000 times","100 million times"],a:3,e:"The biological shield typically reduces dose by a factor on the order of 10\u2078 (100 million-fold)."},
{m:2,q:"Materials commonly used in a biological shield include:",o:["Only lead","Only water","Lead, concrete, steel, water, and polyethylene in combination","Only polyethylene"],a:2,e:"Biological shields combine multiple materials — lead, concrete, steel, water, and polyethylene — each contributing to gamma or neutron attenuation."},
{m:2,q:"A shutdown nuclear reactor is generally considered:",o:["Free of radiation hazard once the chain reaction stops","Less hazardous than during operation","More of a radiation hazard than when operating, mainly due to maintenance and contamination risk during outages","Hazardous only if a fuel handling accident occurs"],a:2,e:"Non-routine maintenance during outages, some inside containment, and the risk of breaching contaminated piping mean most of a worker's annual dose is typically accrued during these brief periods."},
{m:2,q:"N-16, a key activation product in reactor coolant, is formed by:",o:["Direct fission of U-235","A neutron reacting with oxygen-16 in the coolant","Decay of Co-60","Neutron activation of argon in air"],a:1,e:"O-16(n,p)N-16 produces N-16, which decays with a 7-second half-life emitting 6 MeV gammas — significant mainly near the primary loop during operation, given its short half-life."},
{m:2,q:"Ar-41, an activation product of concern around reactor facilities, arises from:",o:["Fission of U-235","Neutron activation of argon-40 in air","Decay of fission product fragments","Corrosion of primary piping"],a:1,e:"Ar-40(n,\u03b3)Ar-41 has a 1.8-hour half-life and emits a 1.3 MeV gamma."},
{m:2,q:"Co-60, the most notorious radionuclide in CRUD (activated corrosion products), is significant because:",o:["It has an extremely short half-life of seconds","It is a strong gamma emitter with a 5.2-year half-life, persisting well after shutdown","It only emits alpha particles","It cannot be detected by any dosimeter"],a:1,e:"Co-60's 5.2-year half-life and strong gamma emission (two gammas totalling 2.5 MeV per decay) make it a persistent hazard long after a reactor shuts down."},
{m:2,q:"High-Level Waste (HLW) is distinguished from lower waste categories by:",o:["Being the largest category by volume","Generating significant heat and requiring shielding","Having no long-lived radionuclides at all","Being safe to handle without any controls"],a:1,e:"HLW — spent fuel and reprocessing waste — generates significant decay heat and requires shielding, unlike LLW and ILW."},
{m:2,q:"By worldwide volume, radioactive waste is overwhelmingly classified as:",o:["High-Level Waste (HLW)","Intermediate-Level Waste (ILW)","Low-Level Waste (LLW)","Split roughly evenly across all three"],a:2,e:"About 95% of waste by volume is LLW, 4% ILW, and only about 1% HLW — though HLW carries a disproportionate share of total activity."},
{m:2,q:"Dry cask storage of spent nuclear fuel is used mainly because:",o:["Permanent geological repositories are widely available and simple to build","Permanent repositories have proven politically difficult, making interim storage necessary","It is required by law in every country","It eliminates the need for any future disposal decision"],a:1,e:"With permanent repositories politically challenging almost everywhere, dry cask storage (passive air cooling, transport-certified) fills the interim gap while keeping future options open."},
{m:2,q:"Fission product half-lives typically run to about centuries, while actinide half-lives run to about:",o:["Seconds","Days","Millennia","No actinides are radioactive"],a:2,e:"Actinides persist far longer than most fission products, which is the basis for the fast-reactor argument about \u201cburning\u201d actinides to reduce long-term waste hazard."},

// ---------------- WEEK 9 / MODULE 3 — AUKUS & NAVAL PROPULSION (confirmed content only) ----------------
{m:3,q:"AUKUS Pillar I refers specifically to:",o:["Advanced cyber capability sharing","The nuclear-powered submarine pathway","Hypersonic weapons development","Space-based surveillance cooperation"],a:1,e:"Pillar I is the submarine component of AUKUS; other advanced capabilities sit under Pillar II."},
{m:3,q:"The three phases of the AUKUS submarine pathway are commonly described as:",o:["Plan and Upgrade, Recruit and Train, Design and Build","Design, Build, Deploy","Acquire, Operate, Retire","Fund, Test, Certify"],a:0,e:"Phase 1 (plan and upgrade), Phase 2 (recruit and train), and Phase 3 (design and build) structure the AUKUS optimal pathway."},
{m:3,q:"Under AUKUS Phase 2, Australia plans to acquire submarines by:",o:["Building an entirely new class domestically from the outset","Purchasing at least three (up to five) US Virginia-class boats from the early-to-mid 2030s","Leasing UK Astute-class boats permanently","Converting existing Collins-class submarines to nuclear power"],a:1,e:"Phase 2 centres on Australia purchasing US Virginia-class submarines while building a nuclear-trained workforce."},
{m:3,q:"SSN-AUKUS, the Phase 3 submarine design, is intended to succeed which existing class?",o:["Vanguard class","Trafalgar class","Astute class","Virginia class"],a:2,e:"SSN-AUKUS is the jointly designed successor to the UK's Astute class, to be built in the UK and South Australia."},
{m:3,q:"Why don't nuclear-powered submarines need Air-Independent Propulsion (AIP)?",o:["AIP is illegal on nuclear boats","The reactor doesn't consume air and can run submerged indefinitely","Nuclear boats never need to stay submerged for long periods","AIP is only compatible with diesel engines"],a:1,e:"AIP exists to extend submerged endurance for conventional diesel-electric boats — a reactor that doesn't need air sidesteps that limitation entirely."},
{m:3,q:"Integrated Full Electric Propulsion (IFEP) describes an architecture where:",o:["The turbine mechanically drives the propeller shaft directly through reduction gears","The prime mover drives generators that supply an electric propulsion motor, with loads on a common electrical system","The submarine has no electrical system at all","Diesel generators are the only power source"],a:1,e:"IFEP routes power through generators to an electric propulsion motor rather than a direct mechanical shaft link, with all electrical loads drawing from one common system."},
{m:3,q:"Nearly all submarine reactors in UK and US service use which reactor technology?",o:["Boiling Water Reactor (BWR)","Pressurised Water Reactor (PWR)","Gas-cooled reactor","Molten salt reactor"],a:1,e:"PWR technology dominates submarine propulsion, just as it does the majority of land-based power reactors."},
{m:3,q:"A Small Modular Reactor (SMR) is generally defined by:",o:["Output under 300 MWe, factory-built and shipped to site","Being used exclusively for submarine propulsion","Output over 1,000 MWe","Always relying on a graphite moderator"],a:0,e:"SMR is a size-and-construction category — generally under 300 MWe (roughly 1,000 MWth), built as factory modules — not tied to one application or moderator type."},
{m:3,q:"\u201cPassive\u201d safety systems in reactor design are characterised by:",o:["Requiring active operator initiation and external power to function","Not requiring external power or active initiation, though components can still fail","Being based purely on the physics of the reactor itself","Always being electrically powered and computer-controlled"],a:1,e:"Passive systems (like gravity-fed cooling) don't need power or activation, unlike engineered (active) systems, though they can still fail mechanically."},
{m:3,q:"\u201cInherent\u201d safety, as distinct from passive or engineered safety, comes from:",o:["A back-up diesel generator","Intrinsic physics principles, such as a negative temperature coefficient of reactivity","A digital reactor protection system","Manual operator intervention"],a:1,e:"Inherent safety relies on the physics itself needing no equipment at all — the negative temperature coefficient is the standard example."},
{m:3,q:"Modern reactor designs, including SMRs, generally favour:",o:["Replacing passive and inherent safety features with engineered (active) ones","Replacing engineered (active) safety features with passive and inherent ones where possible","Relying solely on engineered safety with no passive or inherent features","Eliminating all three categories of safety design"],a:1,e:"The trend is toward passive and inherent safety over active systems, on the logic that equipment which cannot fail to activate is inherently safer than equipment that must be triggered."},
{m:3,q:"Regarding high-level waste from a future Australian nuclear submarine fleet, the current situation is that:",o:["Australia already has full HLW disposal capability at Kimba","The proposed Kimba facility is designed for LLW/ILW only, not HLW, leaving submarine spent fuel disposition unresolved","HLW disposal is not required for any nuclear submarine","The US has agreed to permanently dispose of all Australian submarine waste"],a:1,e:"The Kimba facility in South Australia is designed for low- and intermediate-level waste only, so where AUKUS submarine spent fuel (HLW) will ultimately go remains an open question."},
];

let currentFilter = 'all';
let sessionLength = 20;
let queue = [];
let idx = 0;
let answered = false;
let stats = load('rw_stats', {correct:0, total:0});
let missed = load('rw_missed', []);
let best = load('rw_best', null);
let sessionCelebrated = false;
let reviewMode = false;

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildQueue(){
  let pool = BANK.map((q,i)=>({...q, idx:i}));
  if(reviewMode){
    pool = pool.filter(q => missed.includes(q.idx));
  } else if(currentFilter !== 'all'){
    pool = pool.filter(q => q.m === currentFilter);
  }
  pool = shuffle(pool);
  if(!reviewMode && sessionLength !== 'all'){
    pool = pool.slice(0, Math.min(sessionLength, pool.length));
  }
  queue = pool;
  idx = 0;
  sessionCelebrated = false;
}

function renderChips(){
  const wraps = [
    {id:'all', label:'All ('+BANK.length+')'},
    {id:1, label:'Wk 7'},
    {id:2, label:'Wk 8'},
    {id:3, label:'Wk 9'},
  ];
  const el = document.getElementById('filterChips');
  el.innerHTML = '';
  wraps.forEach(w=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (!reviewMode && currentFilter === w.id ? ' active' : '');
    chip.textContent = w.label;
    chip.onclick = ()=>{ reviewMode=false; currentFilter = w.id; buildQueue(); renderChips(); renderLengthChips(); renderQuestion(); };
    el.appendChild(chip);
  });
  const shuffleChip = document.createElement('div');
  shuffleChip.className = 'chip';
  shuffleChip.textContent = '\u27f3 New shuffle';
  shuffleChip.onclick = ()=>{ buildQueue(); renderQuestion(); };
  el.appendChild(shuffleChip);
}

function renderLengthChips(){
  const el = document.getElementById('lengthChips');
  el.innerHTML = '';
  if(reviewMode){ return; }
  const opts = [
    {id:20, label:'20-question session'},
    {id:'all', label:'Full set'},
  ];
  opts.forEach(o=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (sessionLength === o.id ? ' active' : '');
    chip.textContent = o.label;
    chip.onclick = ()=>{ sessionLength = o.id; buildQueue(); renderLengthChips(); renderQuestion(); };
    el.appendChild(chip);
  });
}

function updateBestText(){
  document.getElementById('bestText').textContent = best ? best.pct + '%' : '--';
}

function showCelebration(pct, isNewBest){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const colors = ['#FFB300','#35D0A0','#E7ECF2','#FF5A52'];
  let confettiHtml = '';
  for(let i=0;i<28;i++){
    const left = (Math.random()*100).toFixed(1);
    const delay = (Math.random()*0.35).toFixed(2);
    const dur = (1.5 + Math.random()*1.1).toFixed(2);
    const color = colors[Math.floor(Math.random()*colors.length)];
    confettiHtml += '<div class="confetti" style="left:'+left+'%;background:'+color+';animation-delay:'+delay+'s;animation-duration:'+dur+'s;"></div>';
  }
  const title = pct === 100 ? 'Perfect run.' : 'Strong pass.';
  const sub = pct === 100 ? 'Every question answered correctly this session.' : 'Above 85% for this session.';
  overlay.innerHTML = '<div class="celebrate-card">' + confettiHtml +
    (isNewBest ? '<div class="celebrate-badge">NEW BEST SCORE</div>' : '') +
    '<div class="celebrate-pct">' + pct + '%</div>' +
    '<div class="celebrate-title">' + title + '</div>' +
    '<div class="celebrate-sub">' + sub + '</div>' +
    '<button class="celebrate-close" id="celebrateClose">Continue</button></div>';
  document.body.appendChild(overlay);
  document.getElementById('celebrateClose').onclick = ()=> overlay.remove();
}

function updateGauge(){
  const pct = stats.total ? Math.round((stats.correct/stats.total)*100) : 0;
  const circ = 2*Math.PI*27;
  const offset = circ - (pct/100)*circ;
  document.getElementById('gaugeFill').style.strokeDashoffset = offset;
  document.getElementById('gaugePct').textContent = stats.total ? pct+'%' : '--';
  document.getElementById('scoreText').textContent = stats.correct + ' / ' + stats.total;
}

function renderQuestion(){
  updateGauge();
  const area = document.getElementById('quizArea');
  const counter = document.getElementById('qCounter');
  if(queue.length === 0){
    counter.textContent = '';
    area.innerHTML = '<div class="card empty"><h2>' + (reviewMode ? 'Nothing to review' : 'No questions in this set') + '</h2><p>' + (reviewMode ? 'You have no missed questions saved yet \u2014 keep practicing and misses will collect here.' : 'Try a different filter.') + '</p></div>';
    return;
  }
  if(idx >= queue.length){
    counter.textContent = '';
    const correctCount = queue.filter(q=>q._correct).length;
    const total = queue.length;
    const pct = total ? Math.round((correctCount/total)*100) : 0;
    area.innerHTML = '<div class="card empty"><h2>Set complete</h2><p>Score this run: ' + correctCount + ' / ' + total + ' (' + pct + '%)<br>Shuffle or pick a new filter to keep going.</p></div>';
    if(!sessionCelebrated && total > 0){
      sessionCelebrated = true;
      let isNewBest = false;
      if(!best || pct > best.pct){
        best = {pct, correct:correctCount, total};
        save('rw_best', best);
        isNewBest = true;
      }
      updateBestText();
      if(pct >= 85){
        showCelebration(pct, isNewBest);
      }
    }
    return;
  }
  answered = false;
  const item = queue[idx];
  const modLabel = item.m === 1 ? 'WEEK 7' : item.m === 2 ? 'WEEK 8' : 'WEEK 9';
  counter.innerHTML = 'QUESTION ' + (idx+1) + ' OF ' + queue.length + ' &nbsp;\u00b7&nbsp; <span class="qmod">' + modLabel + '</span>';

  const letters = ['A','B','C','D'];
  const optOrder = shuffle(item.o.map((text,i)=>({text, orig:i})));

  let html = '<div class="card"><p class="qtext">' + item.q + '</p><div id="optsWrap">';
  optOrder.forEach((opt, i)=>{
    html += '<div class="opt" data-orig="' + opt.orig + '"><span class="letter">' + letters[i] + '</span><span>' + opt.text + '</span></div>';
  });
  html += '</div><div id="fbWrap"></div></div>';
  area.innerHTML = html;

  const optEls = area.querySelectorAll('.opt');
  optEls.forEach(el=>{
    el.onclick = ()=>{
      if(answered) return;
      answered = true;
      const chosen = parseInt(el.getAttribute('data-orig'));
      const correct = chosen === item.a;
      optEls.forEach(o=>{
        o.classList.add('disabled');
        const orig = parseInt(o.getAttribute('data-orig'));
        if(orig === item.a) o.classList.add('correct');
        else if(o === el) o.classList.add('incorrect');
        else o.classList.add('dim');
      });
      item._correct = correct;
      stats.total++;
      if(correct){ stats.correct++; }
      else{
        if(!missed.includes(item.idx)) missed.push(item.idx);
      }
      if(correct && missed.includes(item.idx) && reviewMode){
        missed = missed.filter(m => m !== item.idx);
      }
      save('rw_stats', stats);
      save('rw_missed', missed);
      updateGauge();

      const fb = document.getElementById('fbWrap');
      fb.innerHTML = '<div class="feedback ' + (correct?'correct':'incorrect') + '">' +
        '<span class="verdict">' + (correct ? 'Correct.' : 'Not quite \u2014 correct answer: ' + letters[optOrder.findIndex(o=>o.orig===item.a)] + '.') + '</span>' +
        '<span class="explain">' + item.e + '</span></div>' +
        '<button class="nextbtn" id="nextBtn">Next question</button>';
      document.getElementById('nextBtn').onclick = ()=>{ idx++; renderQuestion(); };
    };
  });
}

document.getElementById('reviewBtn').onclick = ()=>{
  reviewMode = true;
  currentFilter = 'all';
  buildQueue();
  renderChips();
  renderLengthChips();
  renderQuestion();
};
document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('Reset all saved score, best-score, and missed-question history on this device?')){
    stats = {correct:0, total:0};
    missed = [];
    best = null;
    save('rw_stats', stats);
    save('rw_missed', missed);
    save('rw_best', best);
    reviewMode = false;
    currentFilter = 'all';
    buildQueue();
    renderChips();
    renderLengthChips();
    updateBestText();
    renderQuestion();
  }
};

buildQueue();
renderChips();
renderLengthChips();
updateBestText();
renderQuestion();
</script>
